<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 手帐 · 大模型算法工程师求职路线图</title>
  <meta name="description" content="从小白到大模型算法工程师的求职导向学习路线图:数学→深度学习→预训练→微调对齐→部署应用">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <style>
    :root{
      --paper:#fbf8f0; --ink:#23201a; --blue:#2a55b3; --red:#c63a2f;
    }
    body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--paper);color:var(--ink)}
    /* 手帐风格的标题 */
    .markdown-section h1{font-weight:700;border-bottom:2px solid rgba(120,110,85,.4);padding-bottom:6px}
    .markdown-section h2{color:var(--blue);border-left:5px solid var(--blue);padding-left:10px}
    /* 便利贴/标签样式 */
    .markdown-section blockquote{
      border-left:4px solid var(--blue);background:rgba(228,236,255,.35);
      padding:8px 14px;color:#3a3528;border-radius:0 4px 4px 0
    }
    /* 高亮强调 */
    .markdown-section strong{color:var(--red)}
    /* 侧边栏品牌 */
    .app-name a{font-weight:700;color:var(--blue)!important}
    /* 表格更紧凑 */
    .markdown-section table{display:table;width:100%}
  </style>
</head>
<body>
  <div id="app">加载中…如果一直转圈,请检查网络(首次加载需拉取 Docsify)</div>

  <script>
    window.$docsify = {
      name: '📘 AI 手帐',
      repo: 'https://github.com/YuanyuanMa03/ai-to-llm-engineer',

      // 侧边栏
      loadSidebar: true,
      subMaxLevel: 3,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },

      // 首页 = 根 README.md
      homepage: 'README.md',

      // 中文搜索(本地索引)
      search: {
        placeholder: '搜索教程',
        noData: '没有找到结果',
        depth: 3,
        hideOtherSidebarContent: false
      },

      // 页脚
      loadFooter: '_footer.md',

      // 自动跳转标题
      auto2top: true,
      relativePath: true,

      // 主题色
      themeColor: '#2a55b3',

      // 备用:封面
      coverpage: false,

      plugins: [
        // 编辑本文按钮
        function(hook, vm) {
          hook.afterEach(function(html) {
            if (/README/.test(vm.route.file)) return html;
            var url = 'https://github.com/YuanyuanMa03/ai-to-llm-engineer/blob/main/' + vm.route.file;
            return html + '<hr><p style="font-size:13px;color:#8a8068">📝 发现错误? <a href="' + url + '" target="_blank">在 GitHub 上编辑本页</a></p>';
          });
        }
      ]
    };
  </script>

  <!-- Docsify 核心 (锁版本,避免主版本漂移导致渲染失效) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1"></script>
  <!-- 插件:搜索 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/plugins/search.min.js"></script>
  <!-- 插件:代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <!-- 插件:数学公式 KaTeX (docsify-katex 1.x 最新,与 katex@0.16.9 兼容) -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@1.4.5/dist/docsify-katex.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <!-- 插件:页脚 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/plugins/emoji.min.js"></script>
</body>
</html>
