<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0e5">
  <title>AI 手帐 · 大模型工程师冒险地图</title>
  <meta name="description" content="16 个可通关关卡，浏览器内直接运行 Python，从数学基础、Transformer 到 RAG、Agent 与 MCP，把大模型知识变成能跑、能讲、能写进简历的工程战利品。">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="assets/theme.css?v=interactive-lab-4">
</head>
<body>
  <header class="journal-topbar" aria-label="主导航">
    <a class="journal-brand" href="#/" aria-label="AI 手帐首页">
      <span class="journal-brand__mark" aria-hidden="true">AI</span>
      <span>AI 手帐</span>
    </a>

    <nav class="journal-nav" aria-label="学习导航">
      <a href="#/?id=adventure-map">冒险地图</a>
      <a href="quiz/">面试题库</a>
      <a href="#/hand-coding">手撕代码</a>
      <a href="#/about">关于</a>
    </nav>

    <button class="player-progress" id="playerProgress" type="button" aria-label="查看学习进度">
      <span class="player-progress__level" data-player-level>Lv.1 张量见习生</span>
      <span class="player-progress__track" aria-hidden="true"><i data-player-progress-bar></i></span>
      <span class="player-progress__xp" data-player-xp>0 XP · 0 实验星</span>
    </button>
  </header>

  <div id="app">正在翻开手帐…<br><small>如果它一直装深沉，请检查网络连接。</small></div>

  <aside class="quest-rail" id="questRail" aria-labelledby="questRailTitle" hidden>
    <div class="quest-rail__tape" aria-hidden="true"></div>
    <p class="quest-rail__eyebrow">本关任务</p>
    <h2 id="questRailTitle">别只划到最后假装学会</h2>
    <label class="quest-check">
      <input type="checkbox" data-quest="read">
      <span><b>读懂直觉</b><small>能用自己的话复述</small></span>
    </label>
    <label class="quest-check">
      <input type="checkbox" data-quest="code">
      <span><b>跑通代码</b><small>输出不是“相信我能跑”</small></span>
    </label>
    <label class="quest-check">
      <input type="checkbox" data-quest="interview">
      <span><b>回答面试题</b><small>合上答案也能说清楚</small></span>
    </label>
    <p class="quest-rail__hint" data-quest-hint>勾完三项，通关按钮才营业。</p>
    <button class="complete-lesson" id="completeLesson" type="button" disabled>完成本关 · +100 XP</button>
    <div class="lesson-stamp" data-lesson-stamp aria-hidden="true">
      <b>PASS</b><span>工程脑 +1</span>
    </div>
  </aside>

  <div class="achievement-toast" id="achievementToast" role="status" aria-live="polite"></div>

  <button class="run-fab" id="openFirstLab" type="button" aria-label="跳到本页第一个 Python 实验" title="跳到本页第一个 Python 实验">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7V5Z"/></svg>
    <span>打开实验台</span>
  </button>

  <script src="assets/code-lab-core.js?v=interactive-lab-4"></script>
  <script src="assets/app.js?v=interactive-lab-4"></script>
  <script src="assets/code-lab.js?v=interactive-lab-4"></script>
  <script>
    window.$docsify = {
      name: 'AI 手帐',
      repo: 'https://github.com/YuanyuanMa03/ai-to-llm-engineer',
      loadSidebar: true,
      subMaxLevel: 0,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      homepage: 'home.md',
      search: {
        placeholder: '搜一页救命笔记…',
        noData: '这页还没写进手帐',
        depth: 3,
        hideOtherSidebarContent: false
      },
      loadFooter: '_footer.md',
      auto2top: true,
      relativePath: true,
      themeColor: '#12305a',
      plugins: [window.aiJournalPlugin]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@1.4.5/dist/docsify-katex.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/plugins/emoji.min.js"></script>
</body>
</html>
